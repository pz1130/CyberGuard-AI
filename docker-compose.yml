# Official Postgres/Redis entrypoints start as root then gosu. cap_drop ALL
# removes everything except the few caps gosu needs to drop uid.
x-data-hardening: &data-hardening
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - FOWNER
    - SETGID
    - SETUID
    - DAC_OVERRIDE
  security_opt:
    - no-new-privileges:true

# Application images already USER non-root. Drop remaining capabilities,
# forbid privilege re-gain, and make the container rootfs read-only.
x-app-hardening: &app-hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff
    environment:
      POSTGRES_DB: cyberguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only. `"5432:5432"` binds 0.0.0.0 — this database
      # holds encrypted provider keys and the audit trail.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    <<: *data-hardening
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: redis-server --requirepass "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    <<: *data-hardening
    restart: unless-stopped

  api:
    image: cyberguard-api:1.0.0-rc.1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ${CYBERGUARD_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/cyberguard
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Set RUNNER_TOKEN in .env}
      ENVIRONMENT: production
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      TOOL_RUNNER_URL: http://tool-runner:9000
      SKILL_RUNNER_URL: http://skill-runner:9000
      SKILL_RUNNER_TOKEN: ${SKILL_RUNNER_TOKEN:?Set SKILL_RUNNER_TOKEN in .env}
      SKILL_RUNNER_NET_URL: http://skill-runner-net:9000
      EGRESS_PROXY_URL: egress-proxy:3128
      EGRESS_PROXY_CONTROL_URL: http://egress-proxy:3129
      EGRESS_PROXY_TOKEN: ${EGRESS_PROXY_TOKEN:?Set EGRESS_PROXY_TOKEN in .env}
      # RUNNER_TOKEN and others come from .env or defaults in compose
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backup_data:/backups
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    networks:
      - backend
      - sandbox
      - sandbox-net
    <<: *app-hardening
    restart: unless-stopped

  migrate:
    image: cyberguard-api:1.0.0-rc.1
    command: alembic -c alembic.ini upgrade head
    env_file:
      - ${CYBERGUARD_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/cyberguard
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=32m
    networks:
      - backend
    <<: *app-hardening
    restart: "no"

  tool-runner:
    image: cyberguard-tool-runner:1.0.0-rc.1
    build:
      context: .
      dockerfile: tool-runner/Dockerfile
    env_file:
      - ${CYBERGUARD_ENV_FILE:-.env}
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Set RUNNER_TOKEN in .env}
    # No host port: only reachable on the compose network as tool-runner:9000.
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=64m
    networks:
      - backend
    <<: *app-hardening
    restart: unless-stopped

  skill-runner:
    image: cyberguard-skill-runner:1.0.0-rc.1
    build:
      context: .
      dockerfile: skill-runner/Dockerfile
    environment:
      SKILL_RUNNER_TOKEN: ${SKILL_RUNNER_TOKEN:?Set SKILL_RUNNER_TOKEN in .env}
    # Deliberately no env_file: this container must never see the app's secrets.
    # Only `sandbox`, which is internal: true — no postgres, no redis, no egress.
    networks:
      - sandbox
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=64m
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    <<: *app-hardening
    restart: unless-stopped

  skill-runner-net:
    image: cyberguard-skill-runner:1.0.0-rc.1
    build:
      context: .
      dockerfile: skill-runner/Dockerfile
    environment:
      SKILL_RUNNER_TOKEN: ${SKILL_RUNNER_TOKEN:?Set SKILL_RUNNER_TOKEN in .env}
    # Same image as skill-runner; the only difference is which network it is on.
    # `sandbox-net` is internal, so the sole reachable endpoint is egress-proxy.
    networks:
      - sandbox-net
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=64m
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    <<: *app-hardening
    restart: unless-stopped

  egress-proxy:
    image: cyberguard-egress-proxy:1.0.0-rc.1
    build:
      context: .
      dockerfile: egress-proxy/Dockerfile
    command: ["python", "-m", "egress_proxy.main"]
    environment:
      EGRESS_PROXY_TOKEN: ${EGRESS_PROXY_TOKEN:?Set EGRESS_PROXY_TOKEN in .env}
    # The only service bridging the sandbox to the outside. Not on `backend`,
    # so a rebinding trick that slipped the IP check still reaches no database.
    networks:
      - sandbox-net
      - egress
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    <<: *app-hardening
    restart: unless-stopped

  celery_worker:
    image: cyberguard-api:1.0.0-rc.1
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - ${CYBERGUARD_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/cyberguard
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=64m
    networks:
      - backend
    <<: *app-hardening
    restart: unless-stopped

  celery_beat:
    image: cyberguard-api:1.0.0-rc.1
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler --schedule /var/run/celerybeat/celerybeat-schedule --pidfile /var/run/celerybeat/celerybeat.pid
    env_file:
      - ${CYBERGUARD_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/cyberguard
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - celerybeat_data:/var/run/celerybeat
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=32m
    networks:
      - backend
    <<: *app-hardening
    restart: unless-stopped

  webui:
    image: cyberguard-webui:1.0.0-rc.1
    build:
      context: ./webui
      dockerfile: Dockerfile
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777,size=16m
      - /var/cache/nginx:uid=101,gid=101,mode=0755,size=16m
      - /run:uid=101,gid=101,mode=0755,size=16m
    networks:
      - backend
    <<: *app-hardening
    restart: unless-stopped

networks:
  backend:
  # api reaches skill-runner here. Compose network membership is bidirectional,
  # so api:8000 stays reachable from a script — see the design's 5.3.1. What
  # this removes is postgres, redis, and all egress.
  sandbox:
    internal: true
  # Phase 2: the allowlist runner and the proxy. Internal for the same reason —
  # the only way out of it is through egress-proxy, which checks every hop.
  sandbox-net:
    internal: true
  # Ordinary network. egress-proxy alone is attached to it.
  egress:

volumes:
  postgres_data:
  redis_data:
  celerybeat_data:
  backup_data:
