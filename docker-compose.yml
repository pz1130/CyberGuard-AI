services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cyberguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only. `"5432:5432"` binds 0.0.0.0 — this database
      # holds encrypted provider keys and the audit trail, and the compose
      # credentials are postgres/postgres.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cyberguard-redis-pass}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cyberguard
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TOOL_RUNNER_URL: http://tool-runner:9000
      # RUNNER_TOKEN and others come from .env or defaults in compose
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./packages:/app/packages
      - evidence_data:/data/evidence
      - backup_data:/backups

  tool-runner:
    build:
      context: .
      dockerfile: tool-runner/Dockerfile
    env_file:
      - .env
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-changeme-runner-token}
    # No host port: only reachable on the compose network as tool-runner:9000.
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cyberguard
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./packages:/app/packages

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cyberguard
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./packages:/app/packages
      - celerybeat_data:/var/run/celerybeat

  # Flower is the Celery admin UI: it lists task arguments and can revoke
  # running tasks. It ships with no authentication of its own, so it is
  # opt-in (`docker compose --profile monitoring up`) and refuses to start
  # without credentials rather than coming up open.
  flower:
    profiles: ["monitoring"]
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c 'if [ -z "$$FLOWER_BASIC_AUTH" ]; then
        echo "flower: refusing to start without FLOWER_BASIC_AUTH (set it to user:password in .env)" >&2;
        exit 1;
      fi;
      exec celery -A app.workers.celery_app flower --port=5555'
    env_file:
      - .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  celerybeat_data:
  evidence_data:
  backup_data:
