name: cyberguard-test

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cyberguard_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cyberguard-test-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyberguard_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    command: redis-server --requirepass cyberguard-test-only
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cyberguard-test-only", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
