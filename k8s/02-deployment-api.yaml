apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberguard-api
  namespace: cyberguard
  labels:
    app.kubernetes.io/name: cyberguard-api
    app.kubernetes.io/component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cyberguard-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyberguard-api
        app.kubernetes.io/component: api
      annotations:
        # Rollouts trigger annotation change — managed by Argo CD / Flux
        rollme.io/sha256: "AUTO"  # placeholder; replace with git sha in CI
    spec:
      # Graceful shutdown: give in-flight requests 30s to complete
      terminationGracePeriodSeconds: 30

      # Two containers: agent (main) + otel-collector (sidecar)
      containers:
        - name: api
          image: ghcr.io/your-org/cyberguard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: OTEL_SERVICE_NAME
              value: "cyberguard-api"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: LOG_LEVEL
              value: "INFO"
            # Database URL from Secret (not ConfigMap — contains credentials)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cyberguard-secrets
                  key: DATABASE_URL
                  optional: false
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: cyberguard-config
                  key: REDIS_URL
            - name: MOCK_MODE
              value: "false"
          # --- Liveness & Readiness probes ---
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/started
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30  # 30 × 5s = 150s max startup time
          # --- Resource limits ---
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          # --- Security context ---
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # need /tmp for Alembic etc.
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      # --- Celery worker ---
        - name: worker
          image: ghcr.io/your-org/cyberguard:latest
          imagePullPolicy: Always
          command: ["python", "-m", "celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "-Q", "cyberguard,cyberguard-tools"]
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: OTEL_SERVICE_NAME
              value: "cyberguard-worker"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cyberguard-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: cyberguard-config
                  key: REDIS_URL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
