# NOTE: Never commit real secrets to git!
# Use SOPS, Sealed Secrets, or an external secrets operator in production.
apiVersion: v1
kind: Secret
metadata:
  name: cyberguard-secrets
  namespace: cyberguard
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://cyberguard:<PASSWORD>@postgres-svc:5432/cyberguard"
  # Optional: encryption key for sensitive fields ( Fernet / AES )
  # ENCRYPTION_KEY: "your-32-byte-base64-encoded-key"
