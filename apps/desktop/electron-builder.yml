# CyberGuard Desktop — packaging skeleton (M7)
#
# Dry-run / CI without certificates:
#   npm run pack:check
#   npm run dist:dir   # requires electron-builder; produces unsigned dir
#
# Notarized GA (needs Apple Developer ID + notarytool credentials):
#   export CSC_NAME="Developer ID Application: …"
#   export APPLE_ID=… APPLE_APP_SPECIFIC_PASSWORD=… APPLE_TEAM_ID=…
#   npm run dist:mac
#
# See docs/desktop/15-NOTARIZATION-AND-UNINSTALL.md

appId: com.cyberguard.desktop
productName: CyberGuard
copyright: Copyright © CyberGuard

directories:
  output: dist-release
  buildResources: build

files:
  - electron/**/*
  - dist-renderer/**/*
  - package.json
  - "!**/*.{map,md}"
  - "!scripts/**"
  - "!node_modules/**/{test,tests,__tests__}/**"

# Sidecar is expected to be a PyInstaller onedir next to the app in production.
# Dev continues to spawn repo .venv python. Extra resources reserved:
extraResources:
  - from: build/sidecar
    to: sidecar
    filter:
      - "**/*"
    # optional — pack:check allows missing build/sidecar

mac:
  category: public.app-category.productivity
  # Dev identity is separate (scripts/codesign-*-dev.sh). GA uses Developer ID:
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements/release.plist
  entitlementsInherit: entitlements/release.plist
  extendInfo:
    NSCameraUsageDescription: null
    NSMicrophoneUsageDescription: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # artifactName keeps version for anti-downgrade (INV-42)
  artifactName: "${productName}-${version}-${arch}.${ext}"

dmg:
  title: CyberGuard ${version}
  writeUpdateInfo: false

afterSign: scripts/notarize.cjs

# Publish is intentionally unset — updates use our Ed25519 channel (update_verify.py),
# not electron-updater default GitHub releases.

protocols: []
