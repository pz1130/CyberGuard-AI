<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard AI - WebUI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover { background-color: #1f2937; }
        .sidebar-item.active { background-color: #3b82f6; color: white; }
        .chat-bubble { max-width: 80%; }
        .header-gradient { background: linear-gradient(90deg, #1e3a5f, #0f4c75, #1e3a5f); }
        .provider-card { transition: all 0.2s; }
        .provider-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3); }
        .modal-overlay { backdrop-filter: blur(4px); }
        .toast { animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .typing-dot { animation: typing 1.4s infinite; }
        @keyframes typing { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-950 text-gray-100">

    <!-- ========== TOAST CONTAINER ========== -->
    <div id="toast-container" class="fixed top-20 right-6 z-[9999] space-y-2"></div>

    <!-- ========== LOGIN SCREEN ========== -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gray-950">
        <div class="w-full max-w-md p-10 bg-gray-900 border border-gray-700 rounded-3xl shadow-2xl">
            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">🛡️</div>
                <h1 class="text-3xl font-bold">CyberGuard AI</h1>
                <p class="text-gray-400 mt-2">企业级 AI Agent 管理平台</p>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="text-sm text-gray-400 mb-2 block">用户名</label>
                    <input id="login-username" type="text" class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-400" placeholder="admin" value="admin">
                </div>
                <div>
                    <label class="text-sm text-gray-400 mb-2 block">密码</label>
                    <input id="login-password" type="password" class="w-full bg-gray-800 border border-gray-600 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-400" placeholder="••••••••" value="admin123">
                </div>
                <div id="login-error" class="text-red-400 text-sm hidden"></div>
                <button onclick="performLogin()" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-semibold text-lg transition-colors flex items-center justify-center gap-2">
                    <span>登录</span>
                </button>
            </div>
            <p class="text-center text-gray-500 text-sm mt-6">默认账号: admin / admin123</p>
        </div>
    </div>

    <!-- ========== MAIN APP ========== -->
    <div id="app-screen" class="hidden">

        <!-- HEADER -->
        <div class="header-gradient w-full h-14 flex items-center px-6 shadow-xl fixed top-0 z-50">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-white/10 rounded-2xl flex items-center justify-center text-2xl">🛡️</div>
                <span class="text-2xl font-semibold tracking-tight">CyberGuard AI</span>
            </div>
            <div class="flex-1 max-w-xl mx-8">
                <div class="relative">
                    <input type="text" id="global-search" class="w-full bg-white/10 border border-white/20 rounded-3xl py-2.5 pl-12 pr-6 text-sm focus:outline-none focus:border-blue-400 placeholder-gray-400" placeholder="搜索 Agent、Skill、Provider...">
                    <i class="fa-solid fa-magnifying-glass absolute left-5 top-3 text-gray-400"></i>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="showPage('chat')" class="px-4 py-2 rounded-2xl hover:bg-white/10 text-sm font-medium transition-colors">
                    <i class="fa-solid fa-comment-dots mr-1"></i> 聊天
                </button>
                <div class="flex items-center gap-3 border-l border-white/20 pl-4">
                    <div class="text-right">
                        <div class="text-sm font-medium" id="header-username">—</div>
                        <div class="text-xs text-green-400 flex items-center gap-1"><i class="fa-solid fa-circle text-[8px]"></i> 在线</div>
                    </div>
                    <button onclick="performLogout()" class="w-8 h-8 flex items-center justify-center rounded-2xl hover:bg-white/10 text-gray-400 hover:text-white transition-colors" title="退出登录">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="flex pt-14 w-full h-screen">
            <!-- LEFT SIDEBAR -->
            <div class="w-64 bg-gray-900/80 border-r border-gray-700 h-full overflow-y-auto py-4 flex flex-col">
                <div class="px-3 text-xs uppercase tracking-widest text-gray-500 mb-2 pl-5">核心</div>
                <div onclick="showPage('chat')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-chat">
                    <i class="fa-solid fa-comment-dots w-5 text-center"></i><span>聊天</span>
                </div>
                <div onclick="showPage('providers')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-providers">
                    <i class="fa-solid fa-server w-5 text-center"></i><span>AI Provider</span>
                </div>
                <div onclick="showPage('agents')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-agents">
                    <i class="fa-solid fa-robot w-5 text-center"></i><span>Sub-Agent</span>
                </div>
                <div onclick="showPage('skills')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-skills">
                    <i class="fa-solid fa-brain w-5 text-center"></i><span>Skill Pool</span>
                </div>

                <div class="px-3 text-xs uppercase tracking-widest text-gray-500 mb-2 pl-5 mt-6">功能</div>
                <div onclick="showPage('knowledge')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-knowledge">
                    <i class="fa-solid fa-book-open w-5 text-center"></i><span>知识库</span>
                </div>
                <div onclick="showPage('groupchat')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-groupchat">
                    <i class="fa-solid fa-users w-5 text-center"></i><span>群聊室</span>
                </div>
                <div onclick="showPage('schedule')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-schedule">
                    <i class="fa-solid fa-clock w-5 text-center"></i><span>定时任务</span>
                </div>

                <div class="px-3 text-xs uppercase tracking-widest text-gray-500 mb-2 pl-5 mt-6">运维</div>
                <div onclick="showPage('mcp')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-mcp">
                    <i class="fa-solid fa-plug w-5 text-center"></i><span>MCP</span>
                </div>
                <div onclick="showPage('envvars')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-envvars">
                    <i class="fa-solid fa-sliders w-5 text-center"></i><span>环境变量</span>
                </div>
                <div onclick="showPage('security')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-security">
                    <i class="fa-solid fa-shield-halved w-5 text-center"></i><span>安全</span>
                </div>
                <div onclick="showPage('tokenusage')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-tokenusage">
                    <i class="fa-solid fa-chart-pie w-5 text-center"></i><span>Token 消耗</span>
                </div>
                <div onclick="showPage('backup')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-backup">
                    <i class="fa-solid fa-download w-5 text-center"></i><span>备份</span>
                </div>
                <div onclick="showPage('auditlogs')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-auditlogs">
                    <i class="fa-solid fa-clipboard-list w-5 text-center"></i><span>审计日志</span>
                </div>
                <div onclick="showPage('users')" class="sidebar-item flex items-center gap-3 px-5 py-3 cursor-pointer rounded-xl mx-2" id="tab-users">
                    <i class="fa-solid fa-users-gear w-5 text-center"></i><span>用户管理</span>
                </div>
            </div>

            <!-- MAIN CONTENT -->
            <div class="flex-1 overflow-auto p-8" id="main-content">
                <!-- Dynamically loaded page content goes here -->
            </div>
        </div>
    </div>

    <!-- ========== GENERIC MODAL ========== -->
    <div id="generic-modal" onclick="if(event.target===this)closeModal()" class="hidden fixed inset-0 bg-black/70 modal-overlay flex items-center justify-center z-[9999]">
        <div id="generic-modal-content" class="bg-gray-800 w-[560px] max-h-[85vh] overflow-y-auto rounded-3xl p-8"></div>
    </div>

    <script>
    // ===================================================================
    // CONFIG
    // ===================================================================
    const API_BASE = 'http://localhost:8000/api/v1';
    let accessToken = localStorage.getItem('cg_token') || null;
    let currentUser = JSON.parse(localStorage.getItem('cg_user') || 'null');
    let currentPage = 'chat';

    // ===================================================================
    // AUTH
    // ===================================================================
    function getHeaders() {
        const h = { 'Content-Type': 'application/json' };
        if (accessToken) h['Authorization'] = `Bearer ${accessToken}`;
        return h;
    }

    async function performLogin() {
        const btn = document.getElementById('login-btn');
        const errEl = document.getElementById('login-error');
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;

        errEl.classList.add('hidden');
        btn.innerHTML = '<i class="fa-solid fa-spinner spinner"></i> 登录中...';
        btn.disabled = true;

        try {
            const res = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (!res.ok) {
                const err = await res.json();
                errEl.textContent = err.detail || '登录失败';
                errEl.classList.remove('hidden');
                return;
            }

            const data = await res.json();
            accessToken = data.access_token;
            currentUser = data.user;
            localStorage.setItem('cg_token', accessToken);
            localStorage.setItem('cg_user', JSON.stringify(currentUser));

            document.getElementById('header-username').textContent = currentUser.username + ' (' + currentUser.role + ')';
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            showPage('chat');
        } catch (e) {
            errEl.textContent = '无法连接后端服务，请确认 FastAPI 已启动 (http://localhost:8000)';
            errEl.classList.remove('hidden');
        } finally {
            btn.innerHTML = '<span>登录</span>';
            btn.disabled = false;
        }
    }

    function performLogout() {
        accessToken = null;
        currentUser = null;
        localStorage.removeItem('cg_token');
        localStorage.removeItem('cg_user');
        document.getElementById('app-screen').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
    }

    // ===================================================================
    // API HELPERS
    // ===================================================================
    async function apiGet(path) {
        const res = await fetch(`${API_BASE}${path}`, { headers: getHeaders() });
        if (res.status === 401) { performLogout(); throw new Error('Unauthorized'); }
        return res.json();
    }

    async function apiPost(path, body) {
        const res = await fetch(`${API_BASE}${path}`, {
            method: 'POST', headers: getHeaders(), body: JSON.stringify(body)
        });
        if (res.status === 401) { performLogout(); throw new Error('Unauthorized'); }
        if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Request failed'); }
        return res.json();
    }

    async function apiPut(path, body) {
        const res = await fetch(`${API_BASE}${path}`, {
            method: 'PUT', headers: getHeaders(), body: JSON.stringify(body)
        });
        if (res.status === 401) { performLogout(); throw new Error('Unauthorized'); }
        if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Request failed'); }
        return res.json();
    }

    async function apiDel(path) {
        const res = await fetch(`${API_BASE}${path}`, { method: 'DELETE', headers: getHeaders() });
        if (res.status === 401) { performLogout(); throw new Error('Unauthorized'); }
        if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Request failed'); }
        return true;
    }

    // ===================================================================
    // TOAST
    // ===================================================================
    function showToast(msg, type='success') {
        const c = document.getElementById('toast-container');
        const colors = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-blue-600', warning: 'bg-amber-600' };
        const icons = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle', warning: 'fa-exclamation-triangle' };
        const el = document.createElement('div');
        el.className = `toast ${colors[type] || 'bg-emerald-600'} text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm`;
        el.innerHTML = `<i class="fa-solid ${icons[type] || 'fa-check-circle'}"></i> ${msg}`;
        c.appendChild(el);
        setTimeout(() => el.remove(), 3500);
    }

    // ===================================================================
    // MODAL
    // ===================================================================
    function openModal(html) {
        document.getElementById('generic-modal-content').innerHTML = html;
        document.getElementById('generic-modal').classList.remove('hidden');
        document.getElementById('generic-modal').classList.add('flex');
    }
    function closeModal() {
        document.getElementById('generic-modal').classList.add('hidden');
        document.getElementById('generic-modal').classList.remove('flex');
    }

    // ===================================================================
    // NAVIGATION
    // ===================================================================
    function showPage(page) {
        currentPage = page;
        // Sidebar highlight
        document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
        const tab = document.getElementById('tab-' + page);
        if (tab) tab.classList.add('active');

        const pages = {
            chat: renderChat,
            providers: () => renderProviders(),
            agents: () => renderAgents(),
            skills: () => renderSkills(),
            knowledge: renderPlaceholder,
            groupchat: renderPlaceholder,
            schedule: renderPlaceholder,
            mcp: renderPlaceholder,
            envvars: renderPlaceholder,
            security: renderPlaceholder,
            tokenusage: renderPlaceholder,
            backup: renderPlaceholder,
            auditlogs: renderPlaceholder,
            users: renderPlaceholder,
        };

        const fn = pages[page] || renderPlaceholder;
        fn();
    }

    function renderPlaceholder(title) {
        title = title || currentPage;
        document.getElementById('main-content').innerHTML = `
            <div class="flex flex-col items-center justify-center h-[60vh] text-center">
                <div class="text-6xl mb-4">🚧</div>
                <h2 class="text-xl font-semibold text-gray-400">${title} 页面</h2>
                <p class="text-gray-500 mt-2">正在实现中...</p>
            </div>`;
    }

    // ===================================================================
    // PAGE: CHAT
    // ===================================================================
    function renderChat() {
        document.getElementById('main-content').innerHTML = `
            <h1 class="text-2xl font-semibold mb-1">与 Master Agent 对话</h1>
            <p class="text-gray-400 mb-6 text-sm">输入您的网络安全需求，Master Agent 将自动解析并调度 Sub-Agent</p>
            <div class="bg-gray-800/60 border border-gray-700 rounded-3xl h-[580px] flex flex-col">
                <div class="flex-1 p-6 overflow-y-auto space-y-5" id="chat-messages">
                    <div class="flex gap-4">
                        <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-2xl flex items-center justify-center flex-shrink-0 text-lg">🧠</div>
                        <div class="chat-bubble bg-gray-700/80 rounded-3xl rounded-tl-none px-5 py-4 text-sm leading-relaxed">
                            您好！我是 Master Agent。<br><br>请描述您的网络安全需求，例如：<br>
                            <span class="text-blue-400">• "扫描 192.168.1.0/24 网段的安全漏洞"</span><br>
                            <span class="text-blue-400">• "分析最近的防火墙日志"</span><br>
                            <span class="text-blue-400">• "生成上周的安全报告"</span>
                        </div>
                    </div>
                </div>
                <div class="p-6 border-t border-gray-700/50">
                    <div class="flex flex-wrap items-center gap-3 mb-3">
                        <label class="text-xs text-gray-400 font-medium">AI Provider:</label>
                        <select id="chat-provider" onchange="onProviderChange()" class="bg-gray-900/80 border border-gray-600 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-400 cursor-pointer">
                            <option value="">🤖 默认</option>
                        </select>
                        <label class="text-xs text-gray-400 font-medium ml-2">模型:</label>
                        <select id="chat-model" class="bg-gray-900/80 border border-gray-600 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-400 cursor-pointer">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    <div class="flex gap-3">
                        <input id="chat-input" type="text" class="flex-1 bg-gray-900/80 border border-gray-600 rounded-2xl px-5 py-3.5 text-sm focus:outline-none focus:border-blue-400" placeholder="输入您的需求... (Enter 发送，Shift+Enter 换行)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}">
                        <button onclick="sendChat()" class="bg-blue-600 hover:bg-blue-500 px-7 rounded-2xl font-medium text-sm transition-colors flex items-center gap-2">
                            <i class="fa-solid fa-paper-plane"></i> 发送
                        </button>
                    </div>
                </div>
            </div>`;

        loadChatProviders();
    }

    async function loadChatProviders() {
        const providerSelect = document.getElementById('chat-provider');
        const modelSelect = document.getElementById('chat-model');
        try {
            const data = await apiGet('/providers');
            const providers = data.providers || [];
            chatProvidersCache = providers;  // Store for onProviderChange lookup
            // Clear and repopulate
            providerSelect.innerHTML = '<option value="">🤖 默认</option>';
            providers.forEach(p => {
                if (p.is_active) {
                    providerSelect.innerHTML += `<option value="${p.id}">${p.name} (${p.provider_type})</option>`;
                }
            });
            onProviderChange();
        } catch (e) {
            modelSelect.innerHTML = '<option value="">默认模型</option>';
        }
    }

    function onProviderChange() {
        const providerSelect = document.getElementById('chat-provider');
        const modelSelect = document.getElementById('chat-model');
        const selectedId = providerSelect.value;

        if (!selectedId) {
            // Default: list all models from all providers
            modelSelect.innerHTML = '<option value="">默认模型</option>';
            return;
        }

        const provider = chatProvidersCache.find(p => String(p.id) === String(selectedId));
        if (provider && provider.models && provider.models.length > 0) {
            modelSelect.innerHTML = provider.models.map(m => `<option value="${m}">${m}</option>`).join('');
        } else {
            modelSelect.innerHTML = '<option value="">默认模型</option>';
        }
    }

    async function sendChat() {
        const input = document.getElementById('chat-input');
        if (!input.value.trim()) return;
        const msg = input.value.trim();
        input.value = '';

        const messages = document.getElementById('chat-messages');
        // User bubble
        messages.innerHTML += `<div class="flex justify-end"><div class="chat-bubble bg-blue-600 text-white rounded-3xl rounded-br-none px-5 py-3 text-sm">${escapeHtml(msg)}</div></div>`;
        messages.scrollTop = messages.scrollHeight;

        // Typing indicator
        const typingId = 'typing-' + Date.now();
        messages.innerHTML += `<div id="${typingId}" class="flex gap-4"><div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-2xl flex items-center justify-center flex-shrink-0 text-lg">🧠</div><div class="chat-bubble bg-gray-700/80 rounded-3xl rounded-tl-none px-5 py-3 flex items-center gap-1"><span class="typing-dot">.</span><span class="typing-dot" style="animation-delay:0.2s">.</span><span class="typing-dot" style="animation-delay:0.4s">.</span></div></div>`;
        messages.scrollTop = messages.scrollHeight;

        const providerId = document.getElementById('chat-provider')?.value || null;
        const model = document.getElementById('chat-model')?.value || null;
        try {
            const data = await apiPost('/chat', { agent_id: null, message: msg, provider_id: providerId, model: model });
            document.getElementById(typingId).remove();
            messages.innerHTML += `<div class="flex gap-4"><div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-2xl flex items-center justify-center flex-shrink-0 text-lg">🧠</div><div class="chat-bubble bg-gray-700/80 rounded-3xl rounded-tl-none px-5 py-4 text-sm leading-relaxed">${escapeHtml(data.response || data.message || '已收到您的请求')}</div></div>`;
        } catch (e) {
            document.getElementById(typingId).remove();
            messages.innerHTML += `<div class="flex gap-4"><div class="w-9 h-9 bg-gradient-to-br from-red-500 to-orange-400 rounded-2xl flex items-center justify-center flex-shrink-0 text-lg">🛡️</div><div class="chat-bubble bg-red-900/40 border border-red-700/50 rounded-3xl rounded-tl-none px-5 py-4 text-sm text-red-300">请求失败: ${escapeHtml(e.message)}</div></div>`;
            showToast('聊天请求失败: ' + e.message, 'error');
        }
        messages.scrollTop = messages.scrollHeight;
    }

    // ===================================================================
    // PAGE: PROVIDERS
    // ===================================================================
    let providersCache = [];
    let chatProvidersCache = [];  // Separate cache for chat page provider list

    async function renderProviders() {
        document.getElementById('main-content').innerHTML = `
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-semibold">AI Provider 配置</h1>
                <button onclick="showAddProviderForm()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-2xl text-sm font-medium flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-plus"></i> 新增 Provider
                </button>
            </div>
            <div id="providers-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                <div class="col-span-2 flex items-center justify-center py-20 text-gray-500"><i class="fa-solid fa-spinner spinner mr-3"></i>加载中...</div>
            </div>`;

        try {
            const data = await apiGet('/providers');
            providersCache = data.providers || [];
            renderProvidersList(providersCache);
        } catch (e) {
            document.getElementById('providers-grid').innerHTML = `<div class="col-span-2 text-center py-20 text-red-400"><i class="fa-solid fa-triangle-exclamation mr-2"></i>加载失败: ${escapeHtml(e.message)}</div>`;
        }
    }

    function renderProvidersList(providers) {
        const grid = document.getElementById('providers-grid');

    async function submitAddSkill() {
        const skill_type = document.getElementById('sf-type').value;
        const name = document.getElementById('sf-name').value.trim();
        const description = document.getElementById('sf-desc').value.trim();
        const config_str = document.getElementById('sf-config').value.trim();

        if (!name) { showToast('请输入名称', 'warning'); return; }

        let config_json = {};
        if (config_str) { try { config_json = JSON.parse(config_str); } catch { showToast('JSON 格式错误', 'warning'); return; } }

        const endpoint_url = 'http://localhost';
        try {
            if (skill_type === 'skill') {
                await apiPost('/skills', { name, description, config_json });
            } else {
                await apiPost('/tools', { name, description, config_json, endpoint_url });
            }
            closeModal();
            showToast(`${skill_type} 添加成功`, 'success');
            renderSkills();
        } catch (e) {
            showToast('添加失败: ' + e.message, 'error');
        }
    }

        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = String(str);
        return div.innerHTML;
    }

    function formatDate(dateStr) {
        if (!dateStr) return '—';
        try { return new Date(dateStr).toLocaleString('zh-CN'); } catch { return dateStr; }
    }

    // ===================================================================
    // INIT
    // ===================================================================
    (async function init() {
        if (accessToken && currentUser) {
            // Verify token is still valid before showing app
            try {
                const res = await fetch(`${API_BASE}/auth/me`, {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });
                if (!res.ok) throw new Error('Token invalid');
                const user = await res.json();
                currentUser = user;
                localStorage.setItem('cg_user', JSON.stringify(currentUser));
                document.getElementById('header-username').textContent = currentUser.username + ' (' + currentUser.role + ')';
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                showPage('chat');
            } catch (e) {
                // Token invalid — clear and show login
                accessToken = null;
                currentUser = null;
                localStorage.removeItem('cg_token');
                localStorage.removeItem('cg_user');
            }
        }
    })();
    </script>
