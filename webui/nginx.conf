server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS so upstreams are re-resolved after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend http://api:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM-backed endpoints (governance AI, chat completions) can take
        # 1-3 minutes — extend timeouts well past nginx defaults (60s).
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        # Streaming endpoints (chat_stream SSE) need buffering off so chunks
        # are flushed to the client immediately.
        proxy_buffering       off;
        proxy_request_buffering off;
    }

    location /ws/ {
        set $backend http://api:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
