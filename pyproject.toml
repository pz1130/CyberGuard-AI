[project]
name = "cyberguard"
version = "1.0.0"
description = "CyberGuard AI Agent Platform - M1 MVP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    # passlib removed: its bcrypt backend is broken against bcrypt >= 5 (it
    # probes with an over-length password during backend init and now raises).
    # app.core.auth calls bcrypt directly, which is what the routers already did.
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "openai>=1.30.0",
    "cryptography>=42.0.0",
    "email-validator>=2.1.0",
    "apscheduler>=3.10.0",
    "bcrypt>=4.0.0",
    "celery[redis]>=5.4.0",
    "croniter>=2.0.0",
    "flower>=2.0.0",
    "boto3>=1.34.0",
    "pgvector>=0.2.0",
    "msal>=1.28.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "python-docx>=1.1.0",
    "ddgs>=6.0.0",
    "langfuse>=2.50.0,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "packages"]
include = ["app*", "llm_router*", "agent_core*"]
exclude = ["tests*", "webui*", "docker*", "migrations*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "greenlet>=3.5.0",
]
