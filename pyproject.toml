[project]
name = "cyberguard"
version = "1.0.0rc1"
description = "Docker reference implementation for governed AI in security operations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    # passlib removed: its bcrypt backend is broken against bcrypt >= 5 (it
    # probes with an over-length password during backend init and now raises).
    # app.core.auth calls bcrypt directly, which is what the routers already did.
    "python-multipart>=0.0.30",
    # Direct dep: skill-bundle frontmatter parsing (app/services/skill_installer.py).
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "httpx2>=2.12.0",
    "httpcore2>=2.10.0",
    "langgraph>=0.2.0",
    "openai>=1.30.0",
    "cryptography>=50.0.1",
    "email-validator>=2.1.0",
    "bcrypt>=4.0.0",
    "celery[redis]>=5.4.0",
    "boto3>=1.34.0",
    "pgvector>=0.2.0",
    "msal>=1.28.0",
    "pypdf>=6.18.1",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "pillow>=12.3.0",
    "python-docx>=1.1.0",
    "ddgs>=6.0.0",
    "langfuse>=2.50.0,<3.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "packages"]
include = ["app*", "llm_router*", "agent_core*"]
exclude = ["tests*", "webui*", "docker*", "migrations*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "greenlet>=3.5.0",
]
