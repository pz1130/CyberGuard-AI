name: release-gate

on:
  pull_request:
  push:
    branches: [main, "codex/release-candidate"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CYBERGUARD_ENV_FILE: /dev/null
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      RUNNER_TOKEN: ci-runner-token
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
      ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      SECRET_KEY: "2222222222222222222222222222222222222222222222222222222222222222"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --extra test
          npm --prefix webui ci
      - name: Run release gate
        run: make check
      - name: Validate release Compose file
        run: make docker-config
      - name: Build release images
        run: make docker-build
      - name: Verify AMD64 runtime from the source build
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci-postgres-password@localhost:5432/cyberguard
          REDIS_URL: redis://:ci-redis-password@localhost:6379/0
          SMOKE_USER: smoke_admin
          SMOKE_PASSWORD: ci-smoke-admin-password
          SMOKE_EMAIL: smoke-admin@example.test
        run: |
          test "$(uname -m)" = "x86_64"
          docker compose up -d --wait
          test "$(docker image inspect cyberguard-api:1.0.0-rc.1 --format '{{.Architecture}}')" = "amd64"
          test "$(docker image inspect cyberguard-tool-runner:1.0.0-rc.1 --format '{{.Architecture}}')" = "amd64"
          test "$(docker image inspect cyberguard-webui:1.0.0-rc.1 --format '{{.Architecture}}')" = "amd64"
          curl --fail --silent --show-error http://localhost:8000/health/ready
          curl --fail --silent --show-error http://localhost:3000/ >/dev/null
          .venv/bin/python -m pytest -q tests/test_smoke_api.py
      - name: Scan release images
        run: make security-scan
      - name: Generate CycloneDX SBOMs
        run: make sbom
      - uses: actions/upload-artifact@v4
        with:
          name: cyberguard-1.0.0-rc.1-sbom
          path: artifacts/*.cdx.json
          if-no-files-found: error
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Remove disposable runtime
        if: always()
        run: docker compose down -v --remove-orphans
